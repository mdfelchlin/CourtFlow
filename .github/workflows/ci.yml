name: CI

on:
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore, build, test
        run: |
          dotnet restore
          dotnet build --no-restore -c Release
          dotnet test --no-build -c Release --logger "trx;LogFileName=testresults.trx"

      - name: Publish sanity (Api, Web, Web.Client, DbMigrator, ServiceDefaults — no deploy)
        run: |
          dotnet publish src/CourtFlow.Api/CourtFlow.Api.csproj -c Release -o /tmp/courtflow-api-out --no-build
          dotnet publish src/CourtFlow.Web/CourtFlow.Web.csproj -c Release -o /tmp/courtflow-web-out --no-build
          dotnet publish src/CourtFlow.Web.Client/CourtFlow.Web.Client.csproj -c Release -o /tmp/courtflow-client-out --no-build
          dotnet publish src/CourtFlow.DbMigrator/CourtFlow.DbMigrator.csproj -c Release -o /tmp/courtflow-db-migrator-out --no-build
          dotnet publish src/CourtFlow.ServiceDefaults/CourtFlow.ServiceDefaults.csproj -c Release -o /tmp/courtflow-servicedefaults-out --no-build

  terraform-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform fmt check
        working-directory: infra/terraform
        run: terraform fmt -check -recursive

      - name: Terraform init/validate (bootstrap)
        working-directory: infra/terraform/bootstrap
        run: |
          terraform init -backend=false
          terraform validate

      - name: Terraform init/validate (dev)
        working-directory: infra/terraform/envs/dev
        run: |
          terraform init -backend=false
          terraform validate

      - name: Terraform init/validate (prod)
        working-directory: infra/terraform/envs/prod
        run: |
          terraform init -backend=false
          terraform validate
