name: Deploy PWA

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: "GitHub environment containing SWA deploy token"
        required: true
        default: production
        type: choice
        options:
          - dev
          - production

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  WASM_CSPROJ: src/CourtFlow.Web.Client/CourtFlow.Web.Client.csproj
  PUBLISH_DIR: ${{ github.workspace }}/pwa

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    name: Build and deploy SWA
    environment: ${{ inputs.target_environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish Blazor WebAssembly
        run: |
          set -e
          dotnet publish "${{ env.WASM_CSPROJ }}" -c Release -o "${{ env.PUBLISH_DIR }}"

      - name: Azure Static Web Apps
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          action: upload
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          app_location: ${{ env.PUBLISH_DIR }}/wwwroot
          api_location: ''
          output_location: ''
          skip_app_build: true
        env:
          SKIP_ENV_VALIDATION: 1
